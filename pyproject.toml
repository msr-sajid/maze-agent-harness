[project]
name = "maze-agent-harness"
version = "0.1.0"
description = "A small agent harness built from first principles: a tool registry, a tool-call loop and a step log."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.scripts]
maze-agent = "maze_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maze_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
